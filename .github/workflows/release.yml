name: Release

# CI 出包：构建 → 组装 bundle → Developer ID 签名 → 公证 → 打包 → 上传 Release
#
# 与本地 sh scripts/release.sh --publish 的区别：
#   - CI 用 Developer ID 证书签名 + 公证，用户下载后**不需要右键打开**（本地那套用
#     Apple Development 证书，只能自用，Gatekeeper 判 rejected）
#   - 组装走的是同一个 scripts/build_bundle.sh，两边产物结构一致
#
# 需要的 repo secrets（值只能由仓库所有者添加，别写进仓库）：
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application 证书导出的 .p12，base64
#   MACOS_CERTIFICATE_PASSWORD    .p12 的密码
#   APPLE_TEAM_ID                 团队 ID，必须与 bundle 一致（见下面校验）
#   APPLE_API_KEY_ID              App Store Connect API Key 的 Key ID
#   APPLE_API_ISSUER              App Store Connect API Key 的 Issuer ID
#   APPLE_API_KEY_P8_BASE64       AuthKey_<KEY_ID>.p8 的内容，base64
#
# 触发方式：
#   - 手动：Actions → Release → Run workflow（publish=false 只构建+公证，产物进 artifact）
#   - 打 tag：git tag v1.0.8 && git push origin v1.0.8（自动发布到 Release）

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 GitHub Release（false = 只构建 + 签名 + 公证，产物放 artifact）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      APP: dist/BeeK.app
      EXPECTED_TEAM_ID: Y9YR86UG94
    steps:
      - uses: actions/checkout@v4

      - name: 算版本号与 tag
        id: ver
        run: |
          set -eu
          V=$(sed -n 's/^version = "\(.*\)".*/\1/p' Cargo.toml | head -1)
          [ -n "$V" ] || { echo "::error::读不到 Cargo.toml 里的 version"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$V"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本 ${V}，tag ${TAG}（资产名 BeeK-v$V.zip，app 的检查更新按这个名字找）"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 检查 secrets（缺了就明确失败，别默默出一个 ad-hoc 包）
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -eu
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                      APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8_BASE64; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then echo "::error::$name 未配置"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          if [ "$APPLE_TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID 必须是 ${EXPECTED_TEAM_ID}（与 bundle 的签名身份一致）"
            exit 1
          fi

      - name: 导入签名证书（临时钥匙串）
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          cert_path="$RUNNER_TEMP/beek-developer-id.p12"
          keychain_path="$RUNNER_TEMP/beek-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: 写 App Store Connect API key（公证用）
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -eu
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: 构建 + 组装 bundle
        env:
          BEEK_BUILD: ${{ github.run_number }}
        run: sh scripts/build_bundle.sh dist

      - name: 签名（Developer ID + hardened runtime + 时间戳）
        run: |
          set -eu
          IDENTITY=$(security find-identity -v -p codesigning "$MACOS_SIGNING_KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::证书里没有 Developer ID Application 身份 —— 公证需要它（Apple Development 不行）"
            security find-identity -v -p codesigning "$MACOS_SIGNING_KEYCHAIN" || true
            exit 1
          fi
          echo "签名身份：$IDENTITY"
          codesign --force --options runtime --timestamp \
            --identifier com.kaisersong.beek \
            --entitlements resources/BeeK.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/beek-codesign.txt"
          grep "TeamIdentifier=$EXPECTED_TEAM_ID" "$RUNNER_TEMP/beek-codesign.txt"

      - name: 公证 + staple
        timeout-minutes: 90
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/beek-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/beek-notarize.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # 这一条是本工作流存在的理由：Gatekeeper 必须判 accepted
          # （本地那套 Apple Development 签名的包这里是 rejected，用户得右键打开）
          spctl -a -vvv --type execute "$APP"
          echo "✅ 签名 + 公证 + Gatekeeper 评估都通过"

      - name: 打包 zip（资产名必须与 app 里的检查更新一致）
        id: pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          ZIP="dist/BeeK-v$VERSION.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "${ZIP}（$(ls -lh "$ZIP" | awk '{print $5}')）"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      - name: 上传 artifact（无论发不发布都留一份，便于人工验证）
        uses: actions/upload-artifact@v4
        with:
          name: BeeK-v${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.pack.outputs.zip }}.sha256
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -eu
          # 先建草稿、传资产、最后才转正式：避免出现「已发布但资产还没上传完」的窗口
          gh release create "$TAG" --title "BeeK $TAG" --generate-notes --draft || true
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "已发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: 清理钥匙串
        if: always()
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN" 2>/dev/null || true
