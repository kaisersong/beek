[package]
name = "beek-windows-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Separate G0 workspace: it must never import the macOS-only BeeK binary.
[workspace]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest", "runtime_shaders"] }
raw-window-handle = "=0.6.2"
serde_json = "1.0"
unicode-segmentation = "=1.12.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
